<html>
<head>
    <title>Personal Portfolio</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/main.css') }}" />

    <!-- IE CSS -->
    <!--[if lte IE 9]>
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/ie9.css') }}" />

    <!--[if lte IE 8]>
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/ie8.css') }}" />
    <![endif]-->

    <!-- No Script CSS -->
    <noscript>
        <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/noscript.css') }}" />
    </noscript>

    <!-- HTML5 Shiv -->
    <!--[if lte IE 8]>
    <script src="{{ url_for('static', filename='assets/js/html5shiv.js') }}"></script>
    <![endif]-->

<body class="is-loading">

    <!-- Wrapper -->
    <div id="wrapper">

        <!-- Main -->
        <section id="main">

            <header>

                <span class="avatar">
                    <img src="{{ url_for('static', filename='images/profile.png') }}" alt="Profile">
                </span>

                <h1>Amna Shakeel</h1>

                <p>Python Developer | Future AI Engineer</p>

            </header>

            <footer>
                <ul class="icons">
                    <li>
                        <a href="https://twitter.com" class="fa-twitter">Twitter</a>
                    </li>

                    <li>
                        <a href="https://instagram.com" class="fa-instagram">Instagram</a>
                    </li>

                    <li>
                        <a href="https://facebook.com" class="fa-facebook">Facebook</a>
                    </li>

                    <li>
                        <a href="https://linkedin.com" class="fa-linkedin">LinkedIn</a>
                    </li>

                    <li>
                        <a href="https://github.com" class="fa-github">GitHub</a>
                    </li>
                </ul>
            </footer>

        </section>

        <!-- Footer -->
        <footer id="footer">
            <ul class="copyright">
                <li>&copy; 2026 Amna Shakeel</li>
                <li>Built with Flask</li>
            </ul>
        </footer>

    </div>

    <!-- Respond.js -->
    <!--[if lte IE 8]>
    <script src="{{ url_for('static', filename='assets/js/respond.min.js') }}"></script>
    <![endif]-->

    <script>
        if ('addEventListener' in window) {
            window.addEventListener('load', function () {
                document.body.className =
                    document.body.className.replace(/\bis-loading\b/, '');
            });

            document.body.className +=
                (navigator.userAgent.match(/(MSIE|rv:11\.0)/) ? ' is-ie' : '');
        }
    </script>

</body>
</html>
